<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星月 · 11.5 生日</title>
<style>
  :root{
    --night-deep:#0e1026; --night:#1a1d3a; --night-2:#2a2040;
    --warm:#ffb84d; --warm-soft:#ffd166; --pink:#ff6f9c;
    --text:#fff; --text-soft:rgba(255,255,255,.72);
    --glass:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.15);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#000; color:var(--text); height:100vh; overflow:hidden;
    user-select:none; position:relative;
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column; transition:opacity .6s ease;}
  .screen.active{display:flex; animation:screenIn .6s ease;}
  @keyframes screenIn{from{opacity:0}to{opacity:1}}

  /* ===== 通用按钮 ===== */
  .btn{padding:14px 44px; border:none; border-radius:999px; cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:2px; color:#3a1f10;
    background:linear-gradient(135deg,#ffd166,#ff8c42);
    box-shadow:0 10px 28px rgba(255,140,66,.45);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:rgba(255,255,255,.1); color:#fff; border:1px solid var(--glass-border); box-shadow:none;}

  /* ===== 封面 ===== */
  #cover{background:linear-gradient(180deg,var(--night-deep),var(--night) 55%,var(--night-2));
    align-items:center; justify-content:center; text-align:center; padding:24px;}
  #cover .moon{font-size:88px; filter:drop-shadow(0 0 40px rgba(255,209,102,.55)); animation:breathe 5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{filter:drop-shadow(0 0 30px rgba(255,209,102,.4))}50%{filter:drop-shadow(0 0 55px rgba(255,209,102,.7))}}
  #cover h1{margin-top:20px; font-size:30px; font-weight:800; letter-spacing:3px;
    background:linear-gradient(120deg,#ffe9a8,#ffb84d 60%,#ff8c42);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  #cover .sub{margin-top:14px; color:var(--text-soft); font-size:14px; line-height:2; max-width:320px;}
  #cover .sub b{color:var(--warm-soft);}

  /* ===== 抖音直播间 ===== */
  #live{background:#0a0a0a;}
  .live-top{display:flex; align-items:center; gap:10px; padding:14px 14px 8px;}
  .live-top .av-wrap{position:relative;}
  .live-top .av{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#3a2a5a,#5a2a4a);
    display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; border:1.5px solid #fff;}
  .live-top .av img{width:100%; height:100%; object-fit:cover;}
  .live-top .av-wrap .follow-dot{position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%; background:#FE2C55; color:#fff;
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:1.5px solid #0a0a0a;}
  .live-top .info{flex:1; min-width:0;}
  .live-top .info b{font-size:15px; display:block;}
  .live-top .info span{font-size:10.5px; color:rgba(255,255,255,.55);}
  .live-top .lamp-tag{font-size:10.5px; padding:3px 9px; border-radius:6px;
    background:linear-gradient(90deg,#ff7a45,#ffa940); color:#fff; font-weight:700;}
  .live-top .close{color:rgba(255,255,255,.6); font-size:20px; padding:2px 6px;}
  .live-sub{display:flex; gap:8px; padding:0 14px; align-items:center;}
  .live-tag{font-size:10.5px; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.15); color:#fff;}
  .live-tag.viewers{background:rgba(0,0,0,.4);}
  .live-main{flex:1; position:relative; margin:10px 12px; border-radius:14px; overflow:hidden;
    background:radial-gradient(circle at 50% 35%,#3a2050 0%,#1a1028 70%);
    display:flex; align-items:center; justify-content:center;}
  .live-main .big{font-size:70px; filter:drop-shadow(0 0 24px rgba(255,111,156,.6));}
  .live-main .live-badge{position:absolute; top:10px; left:10px; font-size:10px; padding:3px 8px;
    background:#FE2C55; border-radius:6px; font-weight:700;}
  /* 礼物飘屏 */
  .gift-fly{position:absolute; left:10px; right:10px; top:50px; height:30px; overflow:hidden;}
  .gift-fly .fly-item{position:absolute; left:0; font-size:12px; padding:4px 12px; border-radius:999px;
    background:linear-gradient(90deg,rgba(254,44,85,.35),rgba(254,44,85,.1));
    white-space:nowrap; animation:flyAcross 5s linear forwards;}
  .gift-fly .fly-item b{color:#ffd166;}
  @keyframes flyAcross{from{transform:translateX(100%);}to{transform:translateX(-120%);}}
  /* 弹幕（带用户名） */
  .danmu{position:absolute; left:10px; right:60px; bottom:10px; display:flex; flex-direction:column; gap:6px; overflow:hidden;}
  .danmu div{font-size:12.5px; color:#fff; background:rgba(0,0,0,.4); padding:5px 12px; border-radius:999px;
    align-self:flex-start; max-width:100%; animation:danmuUp .3s ease; line-height:1.5;}
  .danmu div .uname{color:#ffd166; margin-right:6px; font-weight:600;}
  .danmu div:nth-child(even) .uname{color:#7ae0ff;}
  @keyframes danmuUp{from{opacity:0; transform:translateY(8px)}to{opacity:1}}
  /* 底部 */
  .live-bottom{padding:8px 14px 20px;}
  .input-bar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .input-bar .input{flex:1; height:38px; border-radius:999px; background:rgba(255,255,255,.12);
    color:rgba(255,255,255,.5); font-size:13px; display:flex; align-items:center; padding:0 16px;}
  .input-bar .circle{width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; font-size:17px;}
  .gifts{display:flex; gap:8px; justify-content:space-between; margin-bottom:14px;}
  .gifts .g{width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center; font-size:22px;}
  .start-time{display:block; width:100%; padding:14px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffd166,#ff8c42); color:#3a1f10; font-size:15px; font-weight:700; letter-spacing:2px;}

  /* ===== 跑酷 ===== */
  #run{background:#000;}
  #runCanvas{width:100%; height:100%; display:block;}
  .run-ui{position:absolute; top:0; left:0; right:0; padding:16px; z-index:5;
    display:flex; justify-content:space-between; font-size:13px;}
  .run-ui .lamp{background:rgba(0,0,0,.4); padding:5px 12px; border-radius:999px; color:var(--warm-soft);}
  .run-ui .star-count{background:rgba(0,0,0,.4); padding:5px 12px; border-radius:999px; color:#ffd166;}
  .run-progress{position:absolute; bottom:20px; left:20px; right:20px; z-index:5;}
  .run-progress .bar{height:6px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden;}
  .run-progress .fill{height:100%; background:linear-gradient(90deg,#ff8c42,#ffd166); width:0%; border-radius:999px;}
  .run-progress .labels{display:flex; justify-content:space-between; font-size:10px; color:rgba(255,255,255,.6); margin-top:6px;}
  .run-hint{position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,255,255,.5); z-index:5;}
  /* 跑酷中飞过的节点提示 */
  .node-flash{position:absolute; top:30%; left:50%; transform:translateX(-50%); z-index:6;
    text-align:center; opacity:0; transition:opacity .4s; pointer-events:none;}
  .node-flash.show{opacity:1;}
  .node-flash .nd{font-size:12px; letter-spacing:3px; color:var(--warm-soft);}
  .node-flash .nt{font-size:24px; font-weight:800; margin-top:6px;
    background:linear-gradient(120deg,#ffe9a8,#ff8c42);
    -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ===== 相册 ===== */
  #album{background:linear-gradient(180deg,#0e1026,#1a1d3a 60%,#2a1a30); padding:20px;}
  .album-top{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-soft);}
  .album-top .close{cursor:pointer; padding:6px 12px; border:1px solid var(--glass-border); border-radius:999px; background:var(--glass);}
  .page{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity .35s,transform .35s;}
  .page.leaving{opacity:0; transform:translateX(-30px);}
  .page.entering{opacity:0; transform:translateX(30px);}
  .page .date{font-size:12px; letter-spacing:3px; color:var(--warm-soft);}
  .page .gift-tag{margin-top:8px; font-size:12px; padding:4px 14px; border-radius:999px;
    background:rgba(255,209,102,.15); border:1px solid rgba(255,209,102,.4); color:var(--warm-soft);}
  .page h2{margin-top:12px; font-size:26px; font-weight:800; letter-spacing:2px;}
  .page .photo{margin-top:18px; width:180px; height:180px; border-radius:20px; overflow:hidden;
    background:linear-gradient(135deg,#2a2040,#3a2a5a); border:1.5px solid rgba(255,209,102,.3);
    display:flex; align-items:center; justify-content:center; font-size:50px;
    box-shadow:0 12px 36px rgba(0,0,0,.4);}
  .page .photo img{width:100%; height:100%; object-fit:cover;}
  .page .text{margin-top:18px; font-size:14.5px; line-height:2; color:var(--text-soft); max-width:320px;}
  .pager{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
  .pager button{width:50px; height:50px; border-radius:50%; border:1px solid var(--glass-border);
    background:var(--glass); color:#fff; font-size:20px; cursor:pointer;}
  .pager button:disabled{opacity:.3;}
  .dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:200px;}
  .dots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.2);}
  .dots i.on{background:var(--warm-soft); transform:scale(1.4); box-shadow:0 0 8px rgba(255,209,102,.6);}
  .game-tag{font-size:11px; letter-spacing:3px; color:var(--pink); padding:4px 14px; border-radius:999px;
    background:rgba(255,111,156,.12); border:1px solid rgba(255,111,156,.4);}
  /* 抖音粉丝团灯牌 */
  .lamp-tag{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:4px 12px; border-radius:6px; color:#fff;
    background:linear-gradient(90deg,#ff7a45,#ffa940);
    box-shadow:0 2px 10px rgba(255,122,69,.4);}
  .lamp-tag.max{background:linear-gradient(90deg,#FE2C55,#ff6b6b);
    box-shadow:0 2px 14px rgba(254,44,85,.6);}
  /* 抖音礼物标签 */
  .gift-tag{font-size:13px; padding:6px 16px; border-radius:999px; font-weight:700;
    background:linear-gradient(90deg,rgba(254,44,85,.25),rgba(255,209,102,.2));
    border:1px solid rgba(255,209,102,.5); color:#ffd166;}
  .game-title{margin-top:12px; font-size:22px; font-weight:800;}
  .game-desc{margin-top:8px; font-size:13px; color:var(--text-soft); line-height:1.8; max-width:300px;}
  .fw-area{position:relative; width:100%; max-width:340px; height:220px; margin-top:16px; border-radius:18px;
    background:rgba(0,0,0,.3); border:1px dashed rgba(255,209,102,.3); overflow:hidden; cursor:crosshair;}
  .fw-timer{position:absolute; top:10px; right:12px; font-size:13px; color:var(--warm-soft); font-weight:700;}
  .fw-count{margin-top:10px; font-size:12px; color:var(--text-soft);}
  .quiz-box{margin-top:16px; width:100%; max-width:330px;}
  .quiz-q{font-size:15.5px; font-weight:700; line-height:1.7;}
  .quiz-options{margin-top:14px; display:flex; flex-direction:column; gap:9px;}
  .quiz-options button{padding:12px; border:1px solid var(--glass-border); border-radius:13px; cursor:pointer;
    background:var(--glass); color:#fff; font-size:13.5px; text-align:left;}
  .quiz-options button.right{background:rgba(120,220,150,.2); border-color:#7adc96; color:#a8ecc0;}
  .quiz-options button.wrong{background:rgba(255,111,156,.15); border-color:var(--pink);}
  .quiz-progress{margin-top:12px; font-size:12px; color:var(--text-soft);}
  .quiz-result{margin-top:14px; font-size:15px; color:var(--warm-soft); font-weight:700; line-height:1.8;}

  /* ===== 结局 ===== */
  #finale{background:linear-gradient(180deg,#0e1026,#1a1d3a 60%,#2a1a30);
    align-items:center; justify-content:center; text-align:center; padding:24px; overflow-y:auto;}
  #finale .big-moon{font-size:72px; filter:drop-shadow(0 0 40px rgba(255,209,102,.6)); animation:breathe 5s ease-in-out infinite;}
  #finale h2{margin-top:14px; font-size:26px; font-weight:800; letter-spacing:3px;
    background:linear-gradient(120deg,#ffe9a8,#ffb84d,#ff8c42);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  #finale .fphoto{margin-top:18px; width:160px; height:160px; border-radius:22px; overflow:hidden;
    border:2px solid var(--warm); box-shadow:0 0 44px rgba(255,209,102,.4);
    background:linear-gradient(135deg,#3a2a5a,#5a2a4a);
    display:flex; align-items:center; justify-content:center; font-size:48px;}
  #finale .fphoto img{width:100%; height:100%; object-fit:cover;}
  #finale p{margin-top:18px; font-size:14px; line-height:2; color:var(--text-soft); max-width:300px;}
  #finale .timeline{margin-top:18px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:320px;}
  #finale .timeline span{font-size:10px; color:var(--text-soft); padding:3px 8px; border-radius:999px;
    background:rgba(255,255,255,.08); border:1px solid var(--glass-border);}
  #finale .timeline span.hl{color:var(--warm-soft); border-color:rgba(255,209,102,.4);}
  #finale .sign{margin-top:14px; font-size:12px; letter-spacing:4px; color:var(--warm-soft);}

  /* ===== 翻牌配对游戏 ===== */
  #memory{background:linear-gradient(180deg,#14102a,#1f1535);
    align-items:center; justify-content:center; text-align:center; padding:24px;}
  #memory h2{font-size:22px; font-weight:800; letter-spacing:2px;}
  #memory .m-sub{margin-top:10px; font-size:13px; color:var(--text-soft); line-height:1.8;}
  .m-grid{margin-top:26px; display:grid; grid-template-columns:repeat(4,72px); gap:12px; justify-content:center;}
  .m-card{position:relative; width:72px; height:96px; perspective:600px; cursor:pointer;}
  .m-inner{position:absolute; inset:0; transition:transform .5s; transform-style:preserve-3d;}
  .m-card.flipped .m-inner{transform:rotateY(180deg);}
  .m-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:32px;}
  .m-back{background:linear-gradient(135deg,#2a2048,#3a2a5a); border:1.5px solid rgba(255,209,102,.3);
    color:rgba(255,209,102,.5); font-size:20px;}
  .m-front{background:linear-gradient(160deg,#fff8e7,#ffe9c8 60%,#ffd89b); transform:rotateY(180deg);
    flex-direction:column; gap:4px; box-shadow:inset 0 2px 8px rgba(255,255,255,.8), inset 0 -4px 10px rgba(200,120,40,.2);}
  .m-front .m-emoji{font-size:34px; line-height:1; filter:drop-shadow(0 3px 4px rgba(180,100,30,.3));}
  .m-front .m-label{font-size:10px; color:#8a5a20; font-weight:700; letter-spacing:1px;}
  .m-card.matched .m-front{box-shadow:0 0 24px rgba(255,209,102,.6);}
  .m-progress{margin-top:20px; font-size:13px; color:var(--warm-soft);}
  .m-done{margin-top:18px; padding:13px 28px; border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(135deg,#ffd166,#ff8c42); color:#3a1f10; font-size:14px; font-weight:700;
    letter-spacing:2px; display:none;}
  .m-done.show{display:block; animation:screenIn .5s ease;}

  .fx-layer{position:fixed; inset:0; z-index:80; pointer-events:none; display:none;}
  /* 抖音礼物全屏弹窗 */
  .gift-show{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); backdrop-filter:blur(4px);}
  .gift-show.on{display:flex; animation:gsIn .4s ease;}
  @keyframes gsIn{from{opacity:0}to{opacity:1}}
  .gift-show .gs-inner{text-align:center; animation:gsPop .6s cubic-bezier(.2,1.4,.4,1); position:relative;}
  @keyframes gsPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .gift-show .gs-ring{position:absolute; left:50%; top:50%; width:200px; height:200px;
    margin:-100px 0 0 -100px; border-radius:50%;
    border:2px solid rgba(255,209,102,.5);
    box-shadow:0 0 40px rgba(255,209,102,.4), inset 0 0 40px rgba(255,209,102,.2);
    animation:spin 3s linear infinite; pointer-events:none;}
  .gift-show .gs-ring::before,.gift-show .gs-ring::after{content:''; position:absolute; background:#ffd166; border-radius:50%;}
  .gift-show .gs-ring::before{width:8px;height:8px;top:-4px;left:50%;margin-left:-4px;box-shadow:0 0 10px #ffd166;}
  .gift-show .gs-ring::after{width:5px;height:5px;bottom:10px;right:20px;box-shadow:0 0 8px #ffd166;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gift-show .gs-icon{font-size:110px; line-height:1; position:relative; z-index:2;
    filter:drop-shadow(0 0 40px rgba(255,209,102,.8));
    animation:gsFloat 1.5s ease-in-out infinite;}
  @keyframes gsFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .gift-show .gs-user{margin-top:18px; font-size:14px; color:#fff; opacity:.85; display:flex; align-items:center; justify-content:center; gap:8px;}
  .gift-show .gs-user .uav{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#ff6f9c,#ffa940);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
  .gift-show .gs-name{margin-top:6px; font-size:24px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(90deg,#ffd166,#ff8c42,#ffd166);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .gift-show .gs-count{display:inline-block; margin-left:8px; font-size:14px; color:#FE2C55;
    background:rgba(254,44,85,.15); padding:2px 8px; border-radius:6px; vertical-align:middle;}
  .fx-layer.show{display:block;}
  .fx-layer canvas{width:100%; height:100%;}
</style>
</head>
<body>

<!-- 封面 -->
<div class="screen active" id="cover">
  <div class="moon">🌕</div>
  <h1>11.5</h1>
  <p class="sub">有点东西给你看。</p>
  <button class="btn" style="margin-top:28px;" onclick="showScreen('memory')">点开看看</button>
</div>

<!-- 翻牌配对 -->
<div class="screen" id="memory">
  <h2>翻翻看</h2>
  <p class="m-sub">记得这些味道吗？</p>
  <div class="m-grid" id="mGrid"></div>
  <div class="m-progress" id="mProgress"></div>
  <button class="m-done" id="mDone" onclick="showScreen('live')"></button>
</div>
</div>

<!-- 直播间 -->
<div class="screen" id="live">
  <div class="live-top">
    <div class="av-wrap">
      <div class="av" id="liveAv">🌙</div>
      <div class="follow-dot">+</div>
    </div>
    <div class="info"><b>星月</b><span>12.3w 获赞 · 2.1w 粉丝</span></div>
    <span class="lamp-tag">星月团 Lv.1</span>
    <span class="close">✕</span>
  </div>
  <div class="live-sub">
    <span class="live-tag viewers">🔥 12,345 人在看</span>
  </div>
  <div class="live-main">
    <div class="live-badge">LIVE</div>
    <div class="big">🎤</div>
    <div class="gift-fly" id="giftFly"></div>
    <div class="danmu" id="danmu"></div>
  </div>
  <div class="live-bottom">
    <div class="input-bar">
      <div class="input">说点什么...</div>
      <div class="circle">@</div>
      <div class="circle">😊</div>
    </div>
    <div class="gifts">
      <div class="g">🧋</div><div class="g">🍲</div><div class="g">🎁</div>
      <div class="g">🎆</div><div class="g">💫</div><div class="g">🧡</div>
    </div>
    <div style="height:8px;"></div>
  </div>
</div>

<!-- 相册（灯牌升级时间线） -->
<div class="screen" id="album">
  <div class="album-top">
    <span id="pageCounter">第 1 页</span>
    <span class="close" onclick="finishAlbum()">回到结局 ✕</span>
  </div>
  <div id="lampProgress" style="padding:0 20px; font-size:11px; color:rgba(255,255,255,.55);">
    灯牌升级中 · <span id="lampNow" style="color:#ffa940; font-weight:700;">Lv.1</span> / Lv.20
  </div>

/* ---------- 屏幕切换 ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  if(id==='live' && CONFIG.avatar) $('liveAv').innerHTML='<img src="'+CONFIG.avatar+'">';
  if(id==='memory') initMemory();
  if(id==='album'){ renderDots(); showPage(0); }
  // 直播间停留几秒后自然进入回忆
  if(id==='live') setTimeout(()=>showScreen('album'), 5000);
}

/* ==================== 翻牌配对游戏 ==================== */
const MEMORY_CARDS = [
  {icon:'🧋', name:'奶茶三分糖', lamp:5, desc:'灯牌 Lv.5 · 星守护解锁', fx:'guard'},
  {icon:'🍲', name:'深夜火锅', lamp:10, desc:'灯牌 Lv.10 · 嘉年华解锁', fx:'carnival'},
  {icon:'🥤', name:'甘蔗汁加冰', lamp:16, desc:'灯牌 Lv.16 · 宇宙之心解锁', fx:'cosmos'},
  {icon:'🌙', name:'星月', lamp:20, desc:'灯牌 Lv.20 · 橙色满级解锁', fx:'orange'},
];
let mFirst=null, mLock=false, mMatched=0;
function initMemory(){
  const deck = [...MEMORY_CARDS, ...MEMORY_CARDS]
    .sort(()=>Math.random()-.5);
  const grid=$('mGrid'); grid.innerHTML='';
  mFirst=null; mLock=false; mMatched=0;
  $('mProgress').textContent='';
  $('mDone').classList.remove('show');
  deck.forEach((card,idx)=>{
    const el=document.createElement('div');
    el.className='m-card'; el.dataset.icon=card.icon; el.dataset.idx=idx;
    el.innerHTML=`<div class="m-inner">
      <div class="m-face m-back">🌙</div>
      <div class="m-face m-front"><span class="m-emoji">${card.icon}</span><span class="m-label">${card.name}</span></div>
    </div>`;
    el.onclick=()=>flipCard(el, card);
    grid.appendChild(el);
  });
}
function flipCard(el, card){
  if(mLock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  if(!mFirst){ mFirst={el, card}; return; }
  // 第二张
  if(mFirst.card.icon === card.icon){
    // 配对成功
    el.classList.add('matched'); mFirst.el.classList.add('matched');
    mMatched++;
    playGiftFx(card.fx, null);
    mFirst=null;
    if(mMatched===4){
      // 全部点亮：全屏金色爆发 + 大字
      playGiftFx('orange', null);
      const ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);animation:gsIn .4s ease;';
      ov.innerHTML='<div style="text-align:center;animation:gsPop .6s cubic-bezier(.2,1.4,.4,1);">'
        +'<div style="font-size:80px;filter:drop-shadow(0 0 40px rgba(255,209,102,.9))">🌟</div>'
        +'</div>';
      document.body.appendChild(ov);
      // 点任意处或自动2.5秒后走进直播间
      const goLive=()=>{ ov.remove(); showScreen('live'); };
      ov.onclick=goLive;
      setTimeout(goLive, 1500);
    }
  } else {
    mLock=true;
    const f=mFirst;
    setTimeout(()=>{
      el.classList.remove('flipped'); f.el.classList.remove('flipped');
      mFirst=null; mLock=false;
    }, 800);
  }
}

/* ==================== 相册（灯牌升级时间线） ==================== */
let cur = 0, quizIdx = 0, quizRight = 0, fwTimer = null;
function renderDots(){
  const box=$('dots'); box.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('i'); if(i===cur) d.classList.add('on');
    box.appendChild(d);
  });
}
function showPage(i){
  cur=i; const p=PAGES[i];
  $('pageCounter').textContent='第 '+(i+1)+' / '+PAGES.length+' 页';
  if(p.lamp) $('lampNow').textContent='Lv.'+p.lamp;
  const page=$('page');
  page.innerHTML='';
  stopFw();
  if(p.type==='game_fireworks') renderFireworks(page);
  else if(p.type==='quiz') renderQuiz();
  else renderStory(page,p);
  $('prevBtn').disabled=(i===0);
  $('nextBtn').innerHTML=(i===PAGES.length-1)?'🎂':'›';
  renderDots();
  if(p.gift){
    playGiftFx(p.gift,null);
    showGiftShow(p.gift);
  }
}
const GIFT_META = {

function renderStory(page,p){

    <div class="date">${p.date||''}</div>
    <span class="${lampCls}">🌟 星月粉丝团 Lv.${p.lamp||1}${p.lamp>=20?' · 满级':''}</span>
    ${p.gift?`<div class="gift-tag">${{guard:'⭐ 送出 星守护',carnival:'🎆 送出 嘉年华',cosmos:'💫 送出 宇宙之心',orange:'🧡 送出 橙色宇宙之心'}[p.gift]}</div>`:''}

    <div class="photo">${p.img?'<img src="'+p.img+'">':p.emoji}</div>
    <p class="text">${p.text}</p>`;
}
function renderFireworks(page){
  fwCount=0;
  page.innerHTML=`
    <div class="game-tag">🎮 互动时刻</div>
    <div class="game-title">为她放一场烟花</div>
    <p class="game-desc">这 8 秒，屏幕上随便点，每一下都是一朵烟花。</p>
    <div class="fw-area" id="fwArea"><div class="fw-timer" id="fwTimer">8.0s</div></div>
    <div class="fw-count" id="fwCount">放了 0 朵烟花</div>`;
  const area=$('fwArea');
  let remain=8;
  area.addEventListener('pointerdown',e=>{
    const r=area.getBoundingClientRect();
    boom(e.clientX-r.left,e.clientY-r.top);
    fwCount++; $('fwCount').textContent='放了 '+fwCount+' 朵烟花';
  });
  fwTimer=setInterval(()=>{
    remain-=.1; $('fwTimer').textContent=Math.max(remain,0).toFixed(1)+'s';
    if(remain<=0) stopFw();
  },100);
}
let fwCount=0;
function stopFw(){ if(fwTimer){clearInterval(fwTimer);fwTimer=null;} }
function boom(x,y){
  const area=$('fwArea'); if(!area) return;
  const r=area.getBoundingClientRect();
  const colors=['#ffd166','#ff6f9c','#6fd3ff','#a5ff6f','#c792ff','#ff8c42'];
  const c=document.createElement('canvas');
  c.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;';
  c.width=r.width; c.height=r.height; area.appendChild(c);
  const ctx=c.getContext('2d');
  const parts=[];
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:colors[Math.floor(Math.random()*colors.length)]});
  }
  (function frame(){
    ctx.clearRect(0,0,r.width,r.height); let alive=false;
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.life-=.025;
      if(p.life>0){ alive=true;
        ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color;
        ctx.shadowColor=p.color; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
      }
    }
    if(alive) requestAnimationFrame(frame); else c.remove();
  })();
}
function renderQuiz(){
  quizIdx=0; quizRight=0; drawQuiz();
}
function drawQuiz(){
  const box=$('page');
  if(quizIdx>=QUIZ.length){
    box.innerHTML=`
      <div class="game-tag">💘 恋爱小测</div>
      <div class="game-title">我们的默契</div>
      <div class="quiz-box"><div class="quiz-result">默契值 ${quizRight} / ${QUIZ.length} ♥<br>
      ${quizRight===QUIZ.length?'你比谁都记得清楚。':'差一点，再翻翻前面？'}</div></div>`;
    return;
  }
  const q=QUIZ[quizIdx];
  box.innerHTML=`
    <div class="game-tag">💘 恋爱小测</div>
    <div class="game-title">我们的默契</div>
    <div class="quiz-box">
      <div class="quiz-q">${quizIdx+1}. ${q.q}</div>
      <div class="quiz-options">
        ${q.opts.map((o,i)=>`<button onclick="answer(${i},this)">${o}</button>`).join('')}
      </div>
      <div class="quiz-progress">第 ${quizIdx+1} / ${QUIZ.length} 题 · 答对 ${quizRight}</div>
    </div>`;
}
function answer(i,btn){
  const q=QUIZ[quizIdx];
  document.querySelectorAll('.quiz-options button').forEach(b=>b.style.pointerEvents='none');
  if(i===q.ans){btn.classList.add('right');quizRight++;}
  else{btn.classList.add('wrong');document.querySelectorAll('.quiz-options button')[q.ans].classList.add('right');}
  setTimeout(()=>{quizIdx++;drawQuiz();},900);
}
function nextPage(){
  if(cur>=PAGES.length-1){ finishAlbum(); return; }
  const page=$('page');
  page.classList.add('leaving');
  setTimeout(()=>{showPage(cur+1);page.classList.remove('leaving');page.classList.add('entering');setTimeout(()=>page.classList.remove('entering'),350);},300);
}
function prevPage(){
  if(cur<=0) return;
  const page=$('page');
  page.classList.add('leaving');
  setTimeout(()=>{showPage(cur-1);page.classList.remove('leaving');page.classList.add('entering');setTimeout(()=>page.classList.remove('entering'),350);},300);
}
let touchX=null;
document.addEventListener('touchstart',e=>{ if($('album').classList.contains('active')) touchX=e.touches[0].clientX; });
document.addEventListener('touchend',e=>{
  if(!$('album').classList.contains('active')||touchX===null) return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(dx<-50) nextPage(); else if(dx>50) prevPage();
  touchX=null;
});
function finishAlbum(){
  running=false;
  if(CONFIG.finalePhoto) $('finalePhoto').innerHTML='<img src="'+CONFIG.finalePhoto+'">';
  $('finaleText').innerHTML=FINALE_TEXT;
  const tl=$('finaleTimeline'); tl.innerHTML='';
  PAGES.forEach(p=>{ if(!p.date) return;
    const s=document.createElement('span'); s.textContent=p.date.slice(5);
    if(p.gift) s.classList.add('hl'); tl.appendChild(s);
  });
  showScreen('finale');
  playGiftFx('orange',null);
  finaleFireworks();
}

/* 结局自动放烟花 */
function finaleFireworks(){
  const layer=$('giftFx');
  layer.style.display='block';
  const c=$('fxCanvas');
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  const colors=['#ffd166','#ff6f9c','#6fd3ff','#a5ff6f','#c792ff','#ff8c42'];
  let shots=0;
  const timer=setInterval(()=>{
    const x=Math.random()*innerWidth, y=innerHeight*0.2+Math.random()*innerHeight*0.4;
    const parts=[];
    for(let i=0;i<40;i++){
      const a=Math.random()*Math.PI*2, sp=2+Math.random()*4;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:colors[Math.floor(Math.random()*colors.length)]});
    }
    (function frame(){
      ctx.clearRect(0,0,innerWidth,innerHeight); let alive=false;
      for(const p of parts){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.life-=.018;
        if(p.life>0){ alive=true;
          ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color;
          ctx.shadowColor=p.color; ctx.shadowBlur=12;
          ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill();
        }
      }
      if(alive) requestAnimationFrame(frame);
    })();
    shots++;
    if(shots>=10){ clearInterval(timer); setTimeout(()=>layer.style.display='none',2000); }
  },600);
}

/* 礼物粒子 */
function playGiftFx(kind,done){
  const layer=$('giftFx'), c=$('fxCanvas');
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  const W=innerWidth,H=innerHeight;
  const cfg={
    guard:{n:50,colors:['#ffd166','#fff3b0','#ffe9a8'],sp:[1,2.6],mode:'rise'},
    carnival:{n:110,colors:['#ffd166','#ff6f9c','#6fd3ff','#a5ff6f','#c792ff'],sp:[2.5,7],mode:'burst'},
    cosmos:{n:80,colors:['#c792ff','#8fb8ff','#ffffff','#e0c3ff'],sp:[2,5.5],mode:'burst'},
    orange:{n:150,colors:['#ff8c00','#ffd166','#ffb347','#ffffff','#ff6f00'],sp:[2.5,8],mode:'burst'},
  }[kind]||{n:40,colors:['#fff'],sp:[1,2],mode:'rise'};
  const parts=[];
  for(let i=0;i<cfg.n;i++){
    const a=Math.random()*Math.PI*2, sp=cfg.sp[0]+Math.random()*(cfg.sp[1]-cfg.sp[0]);
    parts.push({x:cfg.mode==='burst'?W/2:Math.random()*W, y:cfg.mode==='burst'?H/2:H+10,
      vx:cfg.mode==='burst'?Math.cos(a)*sp:(Math.random()-.5)*1.6,
      vy:cfg.mode==='burst'?Math.sin(a)*sp:-sp,
      life:1, decay:.008+Math.random()*.012, size:2+Math.random()*3.5,
      color:cfg.colors[Math.floor(Math.random()*cfg.colors.length)]});
  }
  layer.classList.add('show');
  const start=performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H); let alive=false;
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; if(cfg.mode==='burst') p.vy+=.06; p.life-=p.decay;
      if(p.life>0){ alive=true;
        ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color;
        ctx.shadowColor=p.color; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
      }
    }
    if(alive&&now-start<2600) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,W,H); layer.classList.remove('show'); done&&done(); }
  })(start);
}
